<!DOCTYPE html>
<html>
<head>
<style>
  .container {
    display: flex;
    gap: 20px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    width: 600px;
  }
  .item {
    flex-shrink: 0;
    width: 250px;
    height: 100px;
    background: red;
    scroll-snap-align: start;
  }
</style>
</head>
<body>
  <div class="container" id="c">
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
  </div>
  <script>
    const el = document.getElementById('c');
    setInterval(() => {
      console.log('scrolling', el.scrollLeft, el.clientWidth, el.scrollWidth);
      if (el.scrollLeft + el.clientWidth >= el.scrollWidth - 8) {
        el.scrollTo({ left: 0, behavior: 'smooth' });
      } else {
        el.scrollBy({ left: el.clientWidth * 0.8, behavior: 'smooth' });
      }
    }, 1000);
  </script>
</body>
</html>
